name: megapay_app
description: メガバンク発・手軽に送金できるマルチ通貨対応アプリ（MVP / Flutter Web）
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.35.0" # DropdownButtonFormField.initialValue 等の新 API を使用

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # CanvasKit はブラウザのシステムフォントを使わず、未収録のグリフに出会うたび
  # fonts.gstatic.com から Noto を実行時ダウンロードする。取得が終わるまで
  # 日本語は豆腐（□）で描画され、CDN が遮断された環境では直らない。
  # そのためアプリ本体に日本語フォントを同梱する。
  # 収録範囲は JIS X 0208 + ASCII + 記号（生成手順は docs/fonts.md 参照）。
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
